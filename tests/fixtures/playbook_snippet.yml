---
- name: Extracted CIS Remediation Fixture
  hosts: all
  tasks:

  
  - name: Ensure aide is installed
    ansible.builtin.package:
      name: aide
      state: present
    when: '"kernel" in ansible_facts.packages'
    tags:
    - CJIS-5.10.1.3
    - DISA-STIG-RHEL-09-651010
    - NIST-800-53-CM-6(a)
    - PCI-DSS-Req-11.5
    - PCI-DSSv4-11.5.2
    - enable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - package_aide_installed

  
  - name: Enable systemd-journald Service - Enable service systemd-journald
    block:

    - name: Enable systemd-journald Service - Enable Service systemd-journald
      ansible.builtin.systemd:
        name: systemd-journald
        enabled: true
        state: started
        masked: false
      when:
      - '"systemd" in ansible_facts.packages'
    tags:
    - DISA-STIG-RHEL-09-211040
    - NIST-800-53-SC-24
    - enable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - service_systemd-journald_enabled
    - special_service_block
    when: '"kernel" in ansible_facts.packages'

  
  - name: Ensure use_pty is enabled in /etc/sudoers
    ansible.builtin.lineinfile:
      path: /etc/sudoers
      regexp: ^[\s]*Defaults.*\buse_pty\b.*$
      line: Defaults use_pty
      validate: /usr/sbin/visudo -cf %s
    when:
    - '"kernel" in ansible_facts.packages'
    - '"sudo" in ansible_facts.packages'
    tags:
    - PCI-DSS-Req-10.2.5
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.6
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy
    - sudo_add_use_pty

  
  - name: Ensure permission u-xs,g-xws,o-xwt on /etc/issue
    ansible.builtin.file:
      path: /etc/issue
      mode: u-xs,g-xws,o-xwt
    when: file_exists.stat is defined and file_exists.stat.exists
    tags:
    - configure_strategy
    - file_permissions_etc_issue
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed